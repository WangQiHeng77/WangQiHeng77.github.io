<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173a35" />
    <meta name="description" content="Wang Qiheng | Robotics, multimodal perception, and embodied intelligence." />
    <title>Wang Qiheng | Robotics</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Back to top">
        <span class="brand-monogram">WQH</span>
        <span class="brand-text">Wang Qiheng</span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="Primary navigation"></nav>
      <button class="language-toggle" id="language-toggle" type="button" aria-label="Switch language">EN</button>
    </header>

    <main id="main-content">
      <section class="hero" id="top">
        <div class="hero-intro">
          <p class="kicker" id="hero-kicker"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-summary" id="hero-summary"></p>
          <div class="hero-actions" id="hero-actions"></div>
        </div>
        <aside class="profile-card" aria-label="Profile snapshot">
          <div class="portrait-frame">
            <img id="portrait" alt="" />
            <div class="portrait-placeholder" id="portrait-placeholder">WQH</div>
          </div>
          <div class="profile-meta">
            <p class="meta-label" id="profile-location"></p>
            <p id="profile-affiliation"></p>
            <div class="profile-links" id="profile-links"></div>
          </div>
        </aside>
      </section>

      <section class="statement section" id="about">
        <div class="section-index">01</div>
        <div class="section-body statement-layout">
          <div>
            <p class="kicker" id="about-kicker"></p>
            <h2 id="about-title"></h2>
          </div>
          <p class="large-copy" id="about-copy"></p>
        </div>
      </section>

      <section class="section" id="research">
        <div class="section-index">02</div>
        <div class="section-body">
          <div class="section-heading">
            <p class="kicker" id="research-kicker"></p>
            <h2 id="research-title"></h2>
          </div>
          <div class="research-grid" id="research-grid"></div>
        </div>
      </section>

      <section class="section work-section" id="work">
        <div class="section-index">03</div>
        <div class="section-body">
          <div class="section-heading split-heading">
            <div>
              <p class="kicker" id="work-kicker"></p>
              <h2 id="work-title"></h2>
            </div>
            <div class="filter-bar" id="filter-bar" aria-label="Work filter"></div>
          </div>
          <div class="work-grid" id="work-grid"></div>
        </div>
      </section>

      <section class="section" id="experience">
        <div class="section-index">04</div>
        <div class="section-body">
          <div class="section-heading">
            <p class="kicker" id="experience-kicker"></p>
            <h2 id="experience-title"></h2>
          </div>
          <ol class="timeline" id="timeline"></ol>
        </div>
      </section>

      <section class="section output-section" id="output">
        <div class="section-index">05</div>
        <div class="section-body output-grid">
          <div>
            <p class="kicker" id="output-kicker"></p>
            <h2 id="output-title"></h2>
          </div>
          <div class="output-list" id="output-list"></div>
        </div>
      </section>

      <section class="contact-section" id="contact">
        <p class="kicker" id="contact-kicker"></p>
        <h2 id="contact-title"></h2>
        <p id="contact-copy"></p>
        <div class="contact-links" id="contact-links"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span id="footer-text"></span>
      <a href="#top" id="back-to-top"></a>
    </footer>

    <script src="content/site-data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
